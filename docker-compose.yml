# Ambiente local completo: aplicação + PostgreSQL + provedor simulado (WireMock) + servidor OAuth 2.0 simulado.
# Uso: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Provedor externo simulado. Cenários por productCode em docker/wiremock/mappings.
  provider:
    image: wiremock/wiremock:3.13.2
    command: ["--port", "8089", "--disable-banner"]
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    ports:
      - "8089:8089"

  # Emite JWTs via client_credentials. Mesma porta dentro e fora da rede do compose,
  # para que o "iss" do token emitido para o host seja o esperado pela aplicação.
  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    environment:
      SERVER_PORT: "8081"
      JSON_CONFIG_PATH: /config/oauth.json
    volumes:
      - ./docker/oauth/oauth.json:/config/oauth.json:ro
    ports:
      - "8081:8081"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_started
      oauth:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      OAUTH_ISSUER_URI: http://localhost:8081/default
      OAUTH_JWK_SET_URI: http://oauth:8081/default/jwks
      OAUTH_AUDIENCE: activation-service
      PROVIDER_BASE_URL: http://provider:8089
      PROVIDER_API_KEY: local-dev-key
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512m
    stop_grace_period: 30s
