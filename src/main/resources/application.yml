spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8081/default}
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8081/default/jwks}
          audiences: ${OAUTH_AUDIENCE:activation-service}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

activation:
  processor:
    enabled: ${ACTIVATION_PROCESSOR_ENABLED:true}
    poll-interval: PT1S
    reconcile-interval: PT30S
    batch-size: 20
    processing-lease: PT2M
    max-attempts: 5
    initial-backoff: PT2S
    max-backoff: PT5M
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${PROVIDER_READ_TIMEOUT:PT5S}
    api-key: ${PROVIDER_API_KEY:}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
